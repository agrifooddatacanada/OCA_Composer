name: Deploy Branch to GitHub Pages (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: string
        default: 'main'
      run_tests:
        description: 'Run unit tests before building'
        required: false
        type: boolean
        default: true
      ga_id:
        description: 'Google Analytics ID (or 0 to disable)'
        required: false
        type: string
        default: '0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-manual"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        if: inputs.run_tests == true
        run: npm run unittest
      
      - name: Set environment variable
        run: echo "CI=false" >> $GITHUB_ENV
      
      - name: Build
        run: npm run build
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}
          REACT_APP_GA_ID: ${{ inputs.ga_id }}
          REACT_APP_ENV: ${{ secrets.REACT_APP_ENV || '' }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4