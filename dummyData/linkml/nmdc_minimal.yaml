id: https://w3id.org/nmdc/nmdc_simplified
name: NMDC_Simplified

classes:
  # Include only 1-2 complete classes with their slots
  CalibrationInformation:
    class_uri: nmdc:CalibrationInformation
    description: A calibration object that is associated with a process.
    slots:
      - calibration_object
      - internal_calibration
      - calibration_target
      - calibration_standard

slots:
  # Include all slot definitions used by your classes
  calibration_object:
    range: DataObject
    description: the file containing calibration data object
  
  internal_calibration:
    range: boolean
    description: whether internal calibration was used, if false, external calibration was used

  calibration_target:
    range: CalibrationTargetEnum
    description: the target measurement of the calibration

  calibration_standard:
    range: CalibrationStandardEnum
    description: the reference standard(s) used for calibration

enums:
  # Include all enums used by your slots
  CalibrationTargetEnum:
    permissible_values:
      mass_charge_ratio:
        title: m/z
        aliases:
          - Mass
          - m/z
      retention_time:
        aliases:
          - RT
      retention_index:
        aliases:
          - RI

  CalibrationStandardEnum:
    permissible_values:
      fames:
        aliases:
          - FAMES
      alkanes:
        aliases:
          - Alkanes
