id: https://example.org/my-schema
name: trout
description: A schema to represent trout-related biological and environmental data.
license: https://creativecommons.org/publicdomain/zero/1.0/
version: 1.0.0
prefixes:
  linkml: "https://w3id.org/linkml/"
imports:
  - linkml:types
default_range: string

classes:
  Trout:
    annotations:
      flagged: For slots that contain personally identifiable information
    description: Details about the sampling site and associated measurements.
    slots:
      - site
      - latitude
      - longitude
      - distance_from_m7
      - waterbody
      - date
      - year
      - mean_temp_year
      - avg_discharge
      - species
      - sex
      - length
      - weight
      - age
      - gonad_weight
      - liver_weight

enums:
  GenderEnum:
    description: Gender entries
    permissible_values:
      M: 
        description: Male
      F: 
        description: Female
      IM: 
        description: Immature Male
      IF: 
        description: Immature Female
      I: 
        description: Immature Unknown
  SiteEnum:
    description: Site entries
    permissible_values:
      AR DS Bitumount:
        description: Athabasca River, Downstream Bitumount site
      AR DS CNRL:
        description: Athabasca River, Downstream central site
      AR DS M0:
        description: Athabasca River, Downstream site M0
      AR DS M3:
        description: Athabasca River, Downstream site M3
      AR DS M4:
        description: Athabasca River, Downstream site M4
      AR DS Suncor:
        description: Athabasca River, Downstream Suncore site
      AR M2:
        description: Athabasca River site M2
      AR M7:
        description: Athabasca River site M7
      AR M8:
        description: Athabasca River site M8
      AR M9:
        description: Athabasca River site M9
      AR US Bitumount:
        description: Athabasca River, Upstream Bitumount site
      AR US CNRL:
        description: Athabasca River, Upstream central site
      AR US M0:
        description: Athabasca River, Upstream site M0
      AR US M4:
        description: Athabasca River, Upstream site M4
      AR US Suncor:
        description: Athabasca River, Upstream Suncore site
      Fort Vermillion:
        description: Fort Vermillion site
      PR Dunvegan:
        description: Peace River, Dunvegan site
      PR Pulp Mill:
        description: Peace River, Pulp Mill site
      PR Shaftesbury:
        description: Peace River, Shaftesbury site
      PR Waste Water Plant:
        description: Peace River, Waste Water plant site

  SpeciesEnum:
    description: Species entries
    permissible_values:
      Trout Perch (TRPR):
        description: Percopsis omiscomaycus

  WaterbodyEnum:
    description: Waterbody entries
    permissible_values:
      Athabasca River:
        description: Athabasca River in Alberta, Canada
      Peace River:
        description: Peace River in Alberta, Canada
        
slots:
  site:
    description: Site from which the observations were collected
    range: SiteEnum
  latitude:
    description: Latitude of the site
    range: float
    annotations:
      flagged: true
  longitude:
    description: Longitude of the site
    range: float
    annotations:
      flagged: true
  distance_from_m7:
    description: Distance from the most norther site, M7
    title: Distance from Site M7
    range: float
    unit:
      ucum_code: km
  waterbody:
    description: The body of water the site belongs to
    range: WaterbodyEnum
  date:
    description: Date of the sample
    range: string
  year:
    description: Year the sample was collected in
    range: integer
  mean_temp_year:
    description: Average water temperature averaged across years
    range: float
    title: Mean water temperature grouped by year
    unit:
      ucum_code: celsius
  avg_discharge:
    description: Average river discharge
    range: float
    title: Average discharge
    unit:
      ucum_code: m2/sec
  species:
    description: Species of the sample
    range: SpeciesEnum
  sex:
    description: Sex of the sample
    range: GenderEnum
    required: false
    annotations:
      flagged: true
  length:
    description: Observed length in cm.
    range: float
    unit:
      ucum_code: cm
  weight:
    description: Observed weight in grams.
    range: float
    required: false
    annotations:
      flagged: true
    unit:
      ucum_code: g
  age:
    description: Estimated age in years.
    range: integer
    required: false
    annotations:
      flagged: true
    unit:
      ucum_code: year
  gonad_weight:
    description: Observed gonad weight in grams.
    range: float
    required: false
    unit:
      ucum_code: g
  liver_weight:
    description: Observed liver weight in grams.
    range: float
    required: false
    unit:
      ucum_code: g
